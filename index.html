<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c101b"><title>RaceLab｜起動中</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#0c101b;color:#f1f5ff;max-width:740px;margin:12vh auto;padding:24px}h1{font-size:22px}p{color:#c6d3e7}a{color:#8cdeeb}progress{width:100%;height:15px}</style></head>
<body><h1>RaceLab を起動しています</h1><p id="status" role="status">安全にアプリを読み込んでいます…</p><progress id="bar" max="100" value="0"></progress><p>初回は約5MBのダウンロードが必要です。次回以降はオフラインでも利用できます（対応環境の場合）。</p>
<script>
(async()=>{
 const COUNT=38, PREFIX='./app/v1/part-', EXPECTED='95937429ea7fe32251a1264171b252e7c3d9cdd8fe9578ddf01c8ea6b1ef78ca';
 const message=document.getElementById('status'),bar=document.getElementById('bar');
 try {
  const chunks=new Array(COUNT);
  let finished=0;
  await Promise.all(Array.from({length:COUNT},async(_,i)=>{
   const r=await fetch(PREFIX+String(i).padStart(3,'0')+'.txt?rev='+EXPECTED,{cache:'default'});
   if(!r.ok)throw Error('プログラムの一部を取得できませんでした（'+(i+1)+'/'+COUNT+'、HTTP '+r.status+'）');
   chunks[i]=await r.text();
   finished++;bar.value=finished/COUNT*85;message.textContent='アプリを準備しています… '+finished+'/'+COUNT;
  }));
  let html=chunks.join('');
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));
  const hash=Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('');
  if(hash!==EXPECTED)throw Error('本体の整合性検査に失敗しました。画面を更新してください。');
  // The original 38 chunks retain their unchanged SHA-256 integrity check.
  // This first-party compatibility adapter is bundled in the versioned loader.
  // It converts human-readable extraction reports into UNCONFIRMED candidates.
  const reportAdapter="/* RaceLab iPhone text-report compatibility adapter.\n * A short user-readable V11.24 report is converted into a deliberately\n * UNCONFIRMED structured import. Never synthesize URL/line verification.\n */\n(()=>{'use strict';\nconst HEADER='【競輪出走情報 iPhone抽出版】';\nconst VERSION='11.24-dom-verified-no-odds-strict';\nfunction convertReport(input){\n if(typeof input!=='string'||!input.trim().startsWith(HEADER))return null;\n if(input.length>150000)throw Error('簡易レポートが長すぎます');\n const lines=input.replace(/\\r\\n?/g,'\\n').split('\\n').map(s=>s.trim());\n const m=lines.find(s=>s.startsWith('識別: '));\n const buildId=m?m.slice('識別: '.length).trim():'';\n if(!/^(?:iphone-easy-20261031-r[1234]|iphone-easy-20261101-r5)$/.test(buildId))throw Error('未対応のiPhone簡易レポートです');\n const current=[];let race=null,ref='iPhone簡易レポート貼付（元ページURLは未記録）';\n for(const line of lines){\n  const h=line.match(/^【([1-9]|1[0-2])R】\\s*(.+)$/);\n  if(h){race={race:h[1],title:h[2],url:ref,entries:[],comments:{},line:'',lineGroups:[]};current.push(race);continue;}\n  if(!race)continue;\n  if(line.startsWith('参考ライン: ')){race.line=line.slice(7).trim();continue;}\n  const mm=line.match(/^([1-9])番\\s+(.+?)\\s*｜\\s*(B[^｜]*)\\s*｜\\s*コメント:\\s*(.*)$/);\n  if(!mm)continue;\n  let nameScore=mm[2],score='';\n  const sm=nameScore.match(/\\s+得点(\\d+(?:\\.\\d+)?)$/);\n  if(sm){score=sm[1];nameScore=nameScore.slice(0,sm.index).trim();}\n  const num=mm[1],name=nameScore.trim(),stats=mm[3];\n  if(!name||race.entries.some(e=>e.car===num))throw Error(race.race+'Rの車番・氏名が重複しています');\n  const find=(label)=>{const m=stats.match(new RegExp('(?:^|\\\\s)'+label+'(\\\\d+)'));return m?m[1]:'';};\n  const entry={car:num,name,score,b:find('B'),s:find('S'),nige:find('逃'),makuri:find('捲'),sashi:find('差'),marking:find('マ'),winRate:'',ren2:'',ren3:'',grade:'',leg:'',pref:''};\n  race.entries.push(entry);\n  if(mm[4]&&mm[4]!=='未取得')race.comments[num]=mm[4];\n }\n if(!current.length||current.some(r=>r.entries.length<3))throw Error('レースまたは出走選手が不足しています');\n const selected=new Set();for(const r of current){\n  if(selected.has(r.race))throw Error('同じレースが重複しています');selected.add(r.race);\n  const g=r.line.split('/').map(s=>s.trim()).filter(Boolean).map(s=>s.split('-').filter(Boolean));\n  r.lineGroups=g;r.lineSeq=g.flat().join('-');\n  r.entryCount=r.entries.length;r.carCount=r.entries.length;r.expectedCarCount=r.entries.length;\n  r.manualLineRequired=true;r.validForPrediction=false;r.lineSource='commentStrictFallback';\n  r.lineVerification={domConfirmed:false,source:null,rawFooter:'',specialContested:/競り|ジカ/.test(Object.values(r.comments).join(' ')),issues:['文章レポート由来：公式DOMと元ページURLを確認していません'],diagnostics:['EASY_REPORT_ADAPTER=1']};\n  r.lineGroupCheck={ok:false,reasons:['文章レポートからの参考ライン'],flatCount:g.flat().length};\n  r.systemReadiness={lineReady:false,lineGroupOK:false,oddsReady:false,coreCandidateReady:false};\n }\n return JSON.stringify({version:VERSION,extractorRevision:'iphone-easy-report-adapter-2',mode:'iphone',buildId,createdAt:new Date().toISOString(),raceCount:current.length,races:current});\n}\nfunction init(){\n document.addEventListener('click',e=>{\n  const button=e.target.closest?.('#keirinImport');if(!button)return;\n  const field=document.getElementById('keirinPaste');if(!field||!field.value.trim().startsWith(HEADER))return;\n  try{const json=convertReport(field.value);if(!json)return;field.value=json;\n   const s=document.getElementById('keirinStatus');if(s)s.textContent='iPhone簡易レポートを出走表データに変換しました。参考ラインは未確認です。';\n  }catch(err){e.preventDefault();e.stopImmediatePropagation();\n   const p=document.getElementById('keirinError');if(p)p.textContent='簡易レポートの読込エラー：'+String(err.message||err);\n  }\n },true);\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();\nglobalThis.RaceLabIphoneReportAdapter=Object.freeze({convertReport});\n})();\n";
  const bodyEnd=html.lastIndexOf('</body>');
  // Reference-only, line-independent simulation for usable iPhone data.
  const keirinNoLineAdapter="/* RaceLab Keirin: observational, line-independent reference simulation.\n * This UX adapter leaves all formal RaceBookmark1123, RaceImportCore and\n * quality/identity checks untouched. It handles ONLY the simple keirinLab.\n * Unconfirmed lineup, comments, and odds never enter the computation.\n */\n(()=>{'use strict';\nconst ROOT='keirinLab';\nconst SCENARIOS=[\n {key:'lead',title:'先行主導（ライン補正なし）'},\n {key:'makuri',title:'捲り展開（ライン補正なし）'},\n {key:'sashi',title:'差し追込（ライン補正なし）'}\n];\nconst $=id=>document.getElementById(id);\nconst text=x=>String(x??'');\nconst finite=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x))?Number(x):null;\nconst value=(e,k)=>finite(e?.observed?.[k])??0;\nconst eligible=r=>!!r&&r.bookmarkSafety?.hold===true&&Array.isArray(r.entries)\n &&r.entries.length>=3&&r.entries.length<=9\n &&r.entries.some(e=>finite(e.observed?.score)!==null);\nlet races=null,revision=0,working=false,buttonLabel='';\nfunction current(){\n if(!races)return null;\n const index=Number($('keirinSelect')?.value);\n return Number.isInteger(index)&&index>=0&&index<races.length?races[index]:null;\n}\nfunction needed(r){return eligible(r);}\nfunction seedFor(r,key){\n let h=2166136261>>>0;\n const label=(r.raceNo||'')+'|'+(r.title||'')+'|'+key+'|'+r.entries.map(e=>e.number+':'+e.observed?.score).join(',');\n for(let i=0;i<label.length;i++){h^=label.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}\n return h||1;\n}\nfunction rng(seed){\n let x=seed>>>0||1;\n return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296;};\n}\nfunction participants(r,scenario){\n const validScores=r.entries.map(e=>finite(e.observed?.score)).filter(x=>x!==null);\n const average=validScores.reduce((a,b)=>a+b,0)/validScores.length;\n return r.entries.map(e=>{\n  const o=e.observed||{},score=finite(o.score);\n  const lead=1.8*Math.log1p(value(e,'nige'))+0.15*value(e,'b');\n  const makuri=2*Math.log1p(value(e,'makuri'));\n  const sashi=2*Math.log1p(value(e,'sashi'))+0.7*Math.log1p(value(e,'marking'));\n  const booster=scenario==='lead'?lead:scenario==='makuri'?makuri:sashi;\n  return {number:e.number,name:e.name,\n   strength:(score===null?0:(score-average)*0.65)+booster};\n });\n}\nfunction simulate(r,scenario,runs){\n if(!needed(r))throw Error('比較できる競走得点がありません');\n if(!Number.isInteger(runs)||runs<1||runs>100000)throw Error('試行回数が不正です');\n const runners=participants(r,scenario),random=rng(seedFor(r,scenario));\n const counts=new Map();\n const marks=new Array(runners.length);\n for(let t=0;t<runs;t++){\n  for(let i=0;i<runners.length;i++){\n   const noise=12*(random()+random()+random()-1.5);\n   marks[i]=[runners[i].number,runners[i].strength+noise];\n  }\n  marks.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);\n  const combination=marks[0][0]+'-'+marks[1][0]+'-'+marks[2][0];\n  counts.set(combination,(counts.get(combination)||0)+1);\n }\n return {scenario,runs,\n  top:[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6)\n  .map(([combination,count])=>({combination,count,frequency:count/runs})),\n  total:counts.size};\n}\nconst el=(tag,label,cls)=>{const n=document.createElement(tag);\n if(label!==undefined)n.textContent=text(label);\n if(cls)n.className=cls;return n;};\nfunction showScenario(box,part){\n const info=SCENARIOS.find(s=>s.key===part.scenario);\n const card=el('article',undefined,'hl-scenario');\n card.style.cssText='width:100%;max-width:100%;min-width:0;box-sizing:border-box;margin-bottom:14px;overflow:hidden';\n card.append(el('h3',info.title));\n const description=el('p','上位6組（モデル内の仮定計算）','hl-footnote');\n card.append(description);\n // No hl-table here: the shared table CSS has min-width:670px and creates\n // a second screen-width column in iPhone Safari, separating % from results.\n const list=el('ol');\n list.style.cssText='list-style:none;margin:0;padding:0;width:100%;min-width:0';\n for(const item of part.top){\n  const li=el('li');\n  li.style.cssText='display:block;width:100%;box-sizing:border-box;padding:10px 2px;border-bottom:1px solid #34445b;overflow-wrap:anywhere';\n  const combination=el('div',item.combination,'hl-ticket');\n  combination.style.cssText='display:block;font-size:19px;font-weight:750';\n  const frequency=el('div','参考出現率 '+(item.frequency*100).toFixed(2)+'%（的中確率ではありません）','hl-footnote');\n  frequency.style.cssText='display:block;margin:3px 0 0;font-size:12px;line-height:1.6';\n  li.append(combination,frequency);list.append(li);\n }\n card.append(list);\n box.append(card);\n}\nfunction referenceLine(r){\n if(!r)return{line:'',status:'未取得'};\n const value=text(r.line||'').trim(),cars=new Set(r.entries.map(e=>String(e.number)));\n const chunks=value.split('/').map(x=>x.trim()).filter(Boolean);\n const groups=chunks.map(x=>x.split('-').map(y=>y.trim()).filter(Boolean));\n const all=groups.flat();\n const valid=all.length===cars.size&&new Set(all).size===cars.size&&\n  all.every(car=>cars.has(car)&&/^[1-9]$/.test(car));\n if(valid)return{line:groups.map(g=>g.join('-')).join(' / '),\n  status:r.bookmarkSafety?.hold===true?'参考ライン・未確認':'Kドリームス掲載ライン（出所確認済み）'};\n if(/競り|ジカ/.test(value))return{line:'競り・ジカ等の可能性あり',status:'編成未確認'};\n return{line:'自動取得できませんでした',status:'未取得'};\n}\nfunction updateLinePreview(r){\n const preview=$('keirinLinePreview');\n if(!preview)return;\n const info=referenceLine(r);\n preview.textContent='読み込みライン：'+info.line+'　｜　'+info.status;\n preview.style.cssText='display:block;max-width:100%;overflow-wrap:anywhere;margin:8px 0 12px;color:#9ee2bd;font-size:13px;line-height:1.6';\n}\nfunction clearOld(){\n const box=$('keirinScenarios');if(box){box.replaceChildren();box.style.gridTemplateColumns='';}\n const focus=$('keirinHoleFocus');if(focus){focus.hidden=true;focus.replaceChildren();}\n}\nfunction sync(){\n const r=current(),button=$('keirinSimulate'),loaded=$('keirinLoaded');\n if(!r||!button||loaded?.hidden)return;\n updateLinePreview(r);\n if(!needed(r)){\n  if(buttonLabel&&button.textContent==='ラインなし参考試算')button.textContent=buttonLabel;\n  return;\n }\n if(!buttonLabel)buttonLabel=button.textContent;\n if(button.disabled)button.disabled=false;\n if(button.textContent!=='ラインなし参考試算')button.textContent='ラインなし参考試算';\n const error=$('keirinError');\n if(error&&/^分析HOLD/.test(error.textContent.trim()))error.textContent='';\n const status=$('keirinStatus');\n const note=races.length+'レースを読み込みました。正式ラインなしで選手数値の参考試算ができます。';\n if(status&&status.textContent!==note)status.textContent=note;\n}\nasync function run(){\n const r=current();if(!needed(r)||working)return;\n const runs=Number($('keirinRuns')?.value)||10000;\n const token=++revision,progress=$('keirinProgress'),box=$('keirinScenarios');\n if(!box)return;\n working=true;clearOld();\n if(progress)progress.textContent='ライン補正なしで参考試算中…';\n try{\n  const output=[];\n  for(const spec of SCENARIOS){\n   // Give Safari an opportunity to paint and accept a race change.\n   await new Promise(resolve=>setTimeout(resolve,0));\n   if(token!==revision) return;\n   const result=simulate(r,spec.key,runs);\n   if(token!==revision) return;\n   output.push(result);\n  }\n  if(token!==revision)return;\n  box.style.gridTemplateColumns='minmax(0,1fr)';\n  output.forEach(x=>showScenario(box,x));\n  if(progress)progress.textContent='完了：'+runs.toLocaleString('ja-JP')+\n   '回×3展開の未校正モデル試行。ライン補正なし・オッズなし。';\n }catch(e){\n  if(progress)progress.textContent='参考試算を実行できません：'+String(e.message||e);\n }finally{working=false;}\n}\nfunction acceptText(raw){\n let source=raw;\n if(source.trimStart().startsWith('【競輪出走情報 iPhone抽出版】')){\n  const transform=globalThis.RaceLabIphoneReportAdapter?.convertReport;\n  if(typeof transform!=='function')return null;\n  source=transform(source);\n }\n if(!source)return null;\n return globalThis.RaceBookmark1123?.parse(source)?.races||null;\n}\nfunction setup(){\n const lab=$(ROOT),importBtn=$('keirinImport'),select=$('keirinSelect'),\n simulateBtn=$('keirinSimulate'),error=$('keirinError'),loaded=$('keirinLoaded');\n if(!lab||!importBtn||!select||!simulateBtn)return;\n // Always show what was read, even when formal lineup verification is absent.\n const input=$('keirinLine');\n if(input?.parentElement?.insertAdjacentElement&&!$('keirinLinePreview')){\n  const preview=el('p',undefined,'hl-footnote');preview.id='keirinLinePreview';\n  input.parentElement.insertAdjacentElement('afterend',preview);\n }\n const observer=new MutationObserver(()=>sync());\n if(error)observer.observe(error,{childList:true,characterData:true,subtree:true});\n if(loaded)observer.observe(loaded,{attributes:true,attributeFilter:['hidden']});\n observer.observe(simulateBtn,{attributes:true,attributeFilter:['disabled']});\n document.addEventListener('click',e=>{\n  const button=e.target?.closest?.('button');if(!button)return;\n  if(button.id==='keirinImport'){\n   let next=null;\n   try{next=acceptText($('keirinPaste')?.value||'');}catch{}\n   if(next){races=next;revision++;clearOld();\n    queueMicrotask(sync);setTimeout(sync,50);}\n   return;\n  }\n  if(button.id==='keirinSimulate'&&needed(current())){\n   e.preventDefault();e.stopImmediatePropagation();e.stopPropagation();\n   run();\n  }\n },true);\n select.addEventListener('change',()=>{\n  revision++;clearOld();working=false;\n  queueMicrotask(sync);setTimeout(sync,0);\n });\n $('keirinFile')?.addEventListener('change',()=>{races=null;revision++;working=false;});\n}\nif(document.readyState==='loading')\n document.addEventListener('DOMContentLoaded',setup,{once:true});\nelse setup();\nglobalThis.RaceLabKeirinObservation=Object.freeze({eligible,participants,simulate,acceptText,referenceLine});\n})();\n";
  // An exact-cover presentation of the model's existing trifecta candidates.
  const keirinFormationAdapter="/* RaceLab Keirin: exact-cover trifecta formation display.\n * Converts ONLY already-displayed model candidate tickets. It never adds\n * cartesian-product tickets that the model did not emit, never uses odds,\n * and does not change the simulation, line verification or purchase gates.\n */\n(()=>{'use strict';\nconst $=id=>document.getElementById(id);\nconst normalizeTicket=input=>{\n const s=String(input??'').normalize('NFKC').trim().replace(/[－ー―–−]/g,'-').replace(/\\s+/g,'');\n if(!/^[1-9]-[1-9]-[1-9]$/.test(s))return null;\n const c=s.split('-');return new Set(c).size===3?s:null;\n};\nconst distinct=input=>{\n if(!Array.isArray(input)||input.length>500)throw Error('候補点数が不正です');\n const out=[],seen=new Set();\n for(const raw of input){\n  const t=normalizeTicket(raw);\n  if(!t)throw Error('買い目の形式を認識できません');\n  if(!seen.has(t)){out.push(t);seen.add(t);}\n }\n return out;\n};\nconst sortCars=arr=>[...new Set(arr)].sort((a,b)=>Number(a)-Number(b));\nconst matchAxes=(a,b,except)=>[0,1,2].every(i=>i===except||a[i].join('')===b[i].join(''));\nconst expandBlocks=blocks=>{\n const out=new Set();\n for(const b of blocks)for(const a of b[0])for(const c of b[1])for(const d of b[2]){\n  if(new Set([a,c,d]).size!==3)throw Error('同じ車番が複数着に含まれています');\n  out.add(a+'-'+c+'-'+d);\n }\n return [...out].sort();\n};\nfunction buildExact(input){\n const tickets=distinct(input);\n if(!tickets.length)return{tickets:[],blocks:[],pointCount:0};\n const blocks=tickets.map(t=>t.split('-').map(x=>[x]));\n // Each merge is a union of two previously verified rectangles differing\n // along precisely one axis; therefore it cannot create a new ticket.\n let changed=true;\n while(changed){\n  changed=false;\n  outer:for(const axis of [2,1,0]){\n   for(let i=0;i<blocks.length;i++)for(let j=i+1;j<blocks.length;j++){\n    if(!matchAxes(blocks[i],blocks[j],axis))continue;\n    blocks[i][axis]=sortCars([...blocks[i][axis],...blocks[j][axis]]);\n    blocks.splice(j,1);changed=true;break outer;\n   }\n  }\n }\n const reconstructed=expandBlocks(blocks),original=[...tickets].sort();\n if(reconstructed.length!==original.length||reconstructed.some((v,i)=>v!==original[i]))\n  throw Error('フォーメーションの点数・組合せが一致しません');\n return{tickets,blocks,pointCount:tickets.length};\n}\nfunction readCards(root){\n if(!root)return null;\n const cards=[...root.querySelectorAll('.hl-scenario')];\n if(cards.length!==3)return null;\n const sections=[];\n for(const [i,card] of cards.entries()){\n  const nodes=[...card.querySelectorAll('.hl-ticket')];\n  if(!nodes.length)return null;\n  const all=nodes.map(n=>normalizeTicket(n.textContent));\n  if(all.some(x=>!x))return null;\n  const mainList=card.querySelector('ol.hl-ticket-list')||card.querySelector('ol');\n  const mainNodes=mainList?[...mainList.querySelectorAll('.hl-ticket')]:[];\n  const main=mainNodes.map(n=>normalizeTicket(n.textContent));\n  if(!main.length||main.some(x=>!x))return null;\n  const lists=[...card.querySelectorAll('ol.hl-ticket-list')];\n  const hole=lists.length>=3?[...lists[2].querySelectorAll('.hl-ticket')].map(n=>normalizeTicket(n.textContent)):[];\n  if(hole.some(x=>!x))return null;\n  sections.push({title:(card.querySelector('h3')?.textContent||'展開'+(i+1)).trim(),\n   all:distinct(all),main:distinct(main),hole:distinct(hole)});\n }\n return sections;\n}\nfunction describeBlock(block){\n const count=block[0].length*block[1].length*block[2].length;\n return{first:block[0].join('・'),second:block[1].join('・'),third:block[2].join('・'),points:count};\n}\nfunction textFor(label,results,race){\n const model=buildExact(results);\n const lines=['【3連単フォーメーション｜'+label+'】'];\n if(race)lines.push('レース: '+race);\n lines.push('候補 '+model.pointCount+'点（表示済み買い目から過不足なく変換）');\n for(const [i,block] of model.blocks.entries()){\n  const x=describeBlock(block);\n  lines.push('〈'+(i+1)+'〉 1着 '+x.first+' ／ 2着 '+x.second+' ／ 3着 '+x.third+'（'+x.points+'点）');\n }\n lines.push('合計 '+model.pointCount+'点','※未校正モデルの候補整理。的中確率・購入推奨ではありません。');\n return lines.join('\\n');\n}\nconst el=(tag,content,cls)=>{\n const n=document.createElement(tag);\n if(content!==undefined)n.textContent=String(content);\n if(cls)n.className=cls;return n;\n};\nfunction copyNow(value,button){\n const mark=ok=>{button.textContent=ok?'コピーしました ✓':'コピー失敗・長押しで選択';};\n const fallback=()=>{\n  const area=el('textarea');area.value=value;area.readOnly=true;\n  area.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01';\n  document.body.appendChild(area);area.focus();area.select();\n  let ok=false;try{ok=!!document.execCommand('copy');}catch{}\n  area.remove();mark(ok);return ok;\n };\n try{\n  if(navigator.clipboard?.writeText){\n   navigator.clipboard.writeText(value).then(()=>mark(true),()=>fallback());\n   return;\n  }\n }catch{}\n fallback();\n}\nfunction formationGroup(label,tickets,race,open){\n const model=buildExact(tickets);\n const details=el('details');\n details.open=!!open;\n details.style.cssText='border:1px solid #50617a;border-radius:9px;margin:10px 0;background:#101a2c;padding:12px;min-width:0;max-width:100%;box-sizing:border-box';\n const summary=el('summary',label+'｜'+model.pointCount+'点');\n summary.style.cssText='cursor:pointer;font-weight:700;line-height:1.6;color:#e9f1ff';\n details.append(summary);\n const group=el('div');\n group.style.cssText='padding-top:10px;min-width:0';\n for(const [i,block] of model.blocks.entries()){\n  const x=describeBlock(block),card=el('div');\n  card.style.cssText='padding:10px 0;border-top:1px solid #34445b;font-size:14px;line-height:1.8;overflow-wrap:anywhere';\n  const head=el('strong','〈'+(i+1)+'〉　'+x.points+'点');\n  head.style.cssText='display:block;color:#f5bd63';\n  card.append(head,\n   el('div','1着　'+x.first),\n   el('div','2着　'+x.second),\n   el('div','3着　'+x.third));\n  group.append(card);\n }\n const button=el('button','📋 このフォーメーションをコピー');\n button.type='button';button.style.cssText='width:100%;min-height:44px;margin-top:10px;padding:11px;border-radius:8px;border:1px solid #82c9d9;background:#204057;color:#f0ffff;font-size:14px;font-weight:700';\n button.addEventListener('click',()=>copyNow(textFor(label,tickets,race),button));\n group.append(button);details.append(group);\n return details;\n}\nfunction panelFor(sections,race){\n const all=distinct(sections.flatMap(s=>s.all));\n const main=distinct(sections.flatMap(s=>s.main));\n const hole=distinct(sections.flatMap(s=>s.hole));\n if(!all.length||!main.length)return null;\n const panel=el('section',undefined,'keirin-formation-panel');\n panel.id='keirinFormation';panel.style.cssText='display:block;min-width:0;max-width:100%;width:100%;box-sizing:border-box;overflow-wrap:anywhere;border:1px solid #425a73;border-radius:12px;padding:14px;margin:16px 0;background:#17253a;color:#e8f0fc';\n panel.append(el('h3','🎯 3連単フォーメーション'));\n const note=el('p','試算画面に表示された組み合わせだけを整理。新たな買い目は加えません。','hl-footnote');\n note.style.cssText='font-size:13px;line-height:1.6;margin:8px 0';\n panel.append(note);\n panel.append(formationGroup('本線候補まとめ',main,race,true));\n if(all.length!==main.length)panel.append(formationGroup('対抗・穴を含む全表示候補',all,race,false));\n if(hole.length)panel.append(formationGroup('穴候補のみ',hole,race,false));\n if(sections.length===3){\n  const each=el('details');each.style.cssText='padding-top:8px';\n  each.append(el('summary','展開別のフォーメーションを見る'));\n  for(const section of sections)each.append(formationGroup(section.title,section.all,race,false));\n  panel.append(each);\n }\n const caveat=el('p','※各候補の発生頻度は実際の的中確率ではありません。','hl-footnote');\n caveat.style.cssText='font-size:12px;color:#bdc9db;margin:10px 0 0';\n panel.append(caveat);\n return panel;\n}\nfunction setup(){\n const root=$('keirinScenarios'),progress=$('keirinProgress'),select=$('keirinSelect');\n if(!root||!progress||!select)return;\n let last='',panel=null;\n const hide=()=>{last='';panel?.remove();panel=null;};\n const render=()=>{\n  if(!/^完了：/.test(progress.textContent||'')){hide();return;}\n  const sections=readCards(root);\n  if(!sections){hide();return;}\n  const race=select.options?.[select.selectedIndex]?.textContent?.trim()||'';\n  const key=JSON.stringify({race,sections});\n  if(key===last&&panel?.isConnected)return;\n  hide();\n  try{\n   panel=panelFor(sections,race);\n   if(panel){root.insertAdjacentElement('beforebegin',panel);last=key;}\n  }catch(err){hide();}\n };\n const observer=new MutationObserver(render);\n observer.observe(root,{childList:true,subtree:true,characterData:true});\n observer.observe(progress,{childList:true,subtree:true,characterData:true});\n select.addEventListener('change',hide);\n $('keirinImport')?.addEventListener('click',hide);\n $('keirinFile')?.addEventListener('change',hide);\n render();\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});\nelse setup();\nglobalThis.RaceLabKeirinFormation=Object.freeze({\n normalizeTicket,distinct,buildExact,expandBlocks,readCards,panelFor,textFor\n});\n})();";
  if(bodyEnd<0)throw Error('アプリHTMLの終端が見つかりません');
  html=html.slice(0,bodyEnd)+'<scr'+'ipt>'+reportAdapter+'</scr'+'ipt>'+'<scr'+'ipt>'+keirinNoLineAdapter+'</scr'+'ipt>'+'<scr'+'ipt>'+keirinFormationAdapter+'</scr'+'ipt>'+html.slice(bodyEnd);

 }catch(err){message.textContent='起動に失敗しました：'+err.message+'。オンラインでページを再読み込みしてください。';bar.hidden=true;}
